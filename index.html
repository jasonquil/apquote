<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>All Points Quote Builder</title>
<style>
:root{--bg:#eef0e8;--panel:#fff;--ink:#1f2418;--muted:#5f6656;--line:#d5d9cb;--green:#415a18;--red:#d81a22;}
@media (prefers-color-scheme: dark){:root{--bg:#171a13;--panel:#22261c;--ink:#e9ecdf;--muted:#a6ad98;--line:#3a4030;--green:#8fb04a;--red:#ff5a60;}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Arial,sans-serif;padding:16px}
form{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:28px;width:min(360px,100%)}
h1{margin:0 0 4px;font-size:20px;color:var(--green)}
p{margin:0 0 18px;color:var(--muted);font-size:14px}
label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:4px}
input[type=password]{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--ink)}
.rem{display:flex;gap:8px;align-items:center;margin:12px 0 16px;font-size:14px}
button{width:100%;font:inherit;font-weight:700;font-size:16px;background:var(--green);color:#fff;border:0;border-radius:8px;padding:12px;cursor:pointer}
button:disabled{opacity:.6}
.err{color:var(--red);font-size:14px;min-height:1.3em;margin-top:10px}
</style>
</head>
<body>
<form id="f">
  <h1>All Points quote builder</h1>
  <p>Enter the password to continue.</p>
  <label for="pw">Password</label>
  <input type="password" id="pw" autocomplete="current-password" autofocus>
  <label class="rem"><input type="checkbox" id="rem" checked> Remember on this computer</label>
  <button id="go">Unlock</button>
  <div class="err" id="err" role="alert"></div>
</form>

const d64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pw){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:d64(LOCK.salt), iterations:LOCK.iter, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:d64(LOCK.iv)}, key, d64(LOCK.ct));
  return new TextDecoder().decode(plain);
}
function show(html){ document.open(); document.write(html); document.close(); }
const KEY = "apqb-pass";
(async () => {
  let saved = null; try { saved = localStorage.getItem(KEY); } catch(e){}
  if(saved){ try { show(await unlock(saved)); return; } catch(e){ try { localStorage.removeItem(KEY); } catch(_){} } }
})();
document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const pw = document.getElementById("pw").value, btn = document.getElementById("go"), err = document.getElementById("err");
  err.textContent = ""; btn.disabled = true; btn.textContent = "Unlocking…";
  try {
    const html = await unlock(pw);
    if(document.getElementById("rem").checked){ try { localStorage.setItem(KEY, pw); } catch(_){} }
    show(html);
  } catch(_){
    err.textContent = "That password isn't right. Passwords are case-sensitive.";
    btn.disabled = false; btn.textContent = "Unlock";
  }
});
</script>
